<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SF Data Generator</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="tb-file">
      <div class="brand">SF Data Generator</div>
      <input id="wf-name" class="wf-name" type="text" aria-label="Tên workflow" placeholder="Tên workflow">
      <div class="toolbar">
        <button id="btn-new" class="tb-wide" title="Workflow mới">Mới</button>
        <button id="btn-open" class="tb-wide" title="Mở file workflow JSON">Mở…</button>
        <button id="btn-save" class="tb-wide" title="Tải workflow JSON (Ctrl+S)">Lưu</button>
        <button id="btn-undo" title="Hoàn tác (Ctrl+Z)" aria-label="Hoàn tác">↶</button>
        <button id="btn-redo" title="Làm lại (Ctrl+Shift+Z)" aria-label="Làm lại">↷</button>
        <input id="file-input" type="file" accept=".json,application/json" hidden>
      </div>
      <button id="seed-chip" class="seed-chip" hidden>Seed</button>
      <button id="btn-more" class="icon more-btn" title="Mẫu và thao tác khác" aria-label="Mẫu và thao tác khác" aria-haspopup="menu" aria-expanded="false">⋯</button>
    </div>
    <div class="tb-run">
      <label class="field-inline seed-field tb-wide" title="Để trống: mỗi lần chạy ra dữ liệu khác. Nhập seed: chạy lại ra đúng dữ liệu cũ.">
        Seed <input id="seed" type="text" placeholder="ngẫu nhiên">
      </label>
      <div class="field-inline org-field">
        <label for="org-select" class="org-label">Org</label>
        <select id="org-select"><option value="">— không kết nối —</option></select>
        <button id="btn-orgs" class="icon tb-wide" title="Tải lại danh sách org từ sf CLI" aria-label="Tải lại danh sách org">⟳</button>
      </div>
      <button id="btn-preview" class="primary" title="Sinh dữ liệu và xem trước (Ctrl+Enter)">▶ Xem trước</button>
      <button id="btn-insert" class="danger" title="Sinh dữ liệu và insert vào org đã chọn">⤒ Insert<span class="lbl-long"> vào org</span></button>
      <label id="theme-field" class="field-inline theme-field tb-wide">
        <span class="sr-only">Giao diện</span>
        <select id="theme-select" title="Giao diện: Theo hệ thống">
          <option value="system">Theo hệ thống</option>
          <option value="light">Sáng</option>
          <option value="dark">Tối</option>
        </select>
      </label>
    </div>
  </header>

  <main class="layout">
    <aside class="palette" aria-label="Thêm bước">
      <h3>Thêm bước</h3>
      <div id="palette-items"></div>
      <p class="hint">Bấm để thêm sau bước đang chọn (hoặc vào nhánh còn trống của nó). Kéo vào một dấu + để đặt đúng chỗ.</p>
      <h3>Mẫu</h3>
      <div id="sample-items"></div>
    </aside>

    <section class="view-wrap">
      <div class="view-tools">
        <button id="btn-collapse-all" title="Thu gọn mọi khung Lặp / Rẽ nhánh">Thu gọn tất cả</button>
        <button id="btn-expand-all" title="Mở mọi khung Lặp / Rẽ nhánh">Mở tất cả</button>
      </div>
      <div id="process" class="process" role="tree" aria-label="Các bước của workflow"></div>
      <section id="issues" class="issues" role="region" aria-label="Lỗi và cảnh báo" hidden>
        <div class="issues-head">
          <span id="issues-count" class="issues-count" aria-live="polite"></span>
          <button id="issues-first" class="issues-first" hidden></button>
          <span class="issues-hint">Bấm một dòng để tới bước · F8: lỗi tiếp theo</span>
          <button id="btn-issues-toggle" class="issues-toggle" aria-expanded="true" aria-controls="issues-list">Thu gọn</button>
        </div>
        <div id="issues-list" class="issues-list"></div>
      </section>
    </section>

    <aside id="inspector" class="inspector" aria-label="Cấu hình bước"></aside>
  </main>

  <section id="results" class="results collapsed">
    <div class="results-head">
      <button id="btn-results-toggle" class="link" aria-expanded="false" aria-controls="results-body">Kết quả <span class="caret" aria-hidden="true">▴</span></button>
      <div id="results-summary" class="summary" aria-live="polite">Chưa chạy.</div>
      <button id="btn-dl-json" disabled>Tải JSON</button>
      <button id="btn-dl-csv" disabled>Tải CSV (tab hiện tại)</button>
      <button id="btn-dl-menu" class="dl-menu" disabled aria-haspopup="menu" aria-expanded="false" title="Tải JSON hoặc CSV của tab hiện tại">⤓ Tải</button>
      <button id="btn-stop" class="danger" hidden title="Dừng sau lô đang gửi. Bản ghi đã insert vẫn ở lại trong org.">Dừng</button>
      <progress id="run-progress" class="run-progress" hidden aria-label="Tiến độ lần chạy"></progress>
    </div>
    <div id="results-body" class="results-body"></div>
  </section>

  <dialog id="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
