<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SF Data Generator</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">SF Data Generator</div>
    <input id="wf-name" class="wf-name" type="text" aria-label="Tên workflow" placeholder="Tên workflow">
    <div class="toolbar">
      <button id="btn-new" title="Workflow mới">Mới</button>
      <button id="btn-open" title="Mở file workflow JSON">Mở…</button>
      <button id="btn-save" title="Tải workflow JSON (Ctrl+S)">Lưu</button>
      <button id="btn-undo" title="Hoàn tác (Ctrl+Z)">↶</button>
      <button id="btn-redo" title="Làm lại (Ctrl+Shift+Z)">↷</button>
      <input id="file-input" type="file" accept=".json,application/json" hidden>
    </div>
    <div class="spacer"></div>
    <label class="field-inline" title="Để trống: mỗi lần chạy ra dữ liệu khác. Nhập seed: chạy lại ra đúng dữ liệu cũ.">
      Seed <input id="seed" type="text" placeholder="ngẫu nhiên" size="9">
    </label>
    <label class="field-inline">
      Org
      <select id="org-select"><option value="">— không kết nối —</option></select>
      <button id="btn-orgs" class="icon" title="Tải lại danh sách org từ sf CLI">⟳</button>
    </label>
    <button id="btn-preview" class="primary" title="Sinh dữ liệu và xem trước (Ctrl+Enter)">▶ Xem trước</button>
    <button id="btn-insert" class="danger" title="Sinh dữ liệu và insert vào org đã chọn">⤒ Insert vào org</button>
    <label id="theme-field" class="field-inline" title="Giao diện sáng hoặc tối. &quot;Theo hệ thống&quot; dùng cài đặt của máy.">
      <span class="sr-only">Giao diện</span>
      <select id="theme-select">
        <option value="system">Theo hệ thống</option>
        <option value="light">Sáng</option>
        <option value="dark">Tối</option>
      </select>
    </label>
  </header>

  <main class="layout">
    <aside class="palette" aria-label="Thêm bước">
      <h3>Thêm bước</h3>
      <div id="palette-items"></div>
      <p class="hint">Bấm để thêm sau bước đang chọn (hoặc vào nhánh còn trống của nó). Kéo vào một dấu + để đặt đúng chỗ.</p>
      <h3>Mẫu</h3>
      <div id="sample-items"></div>
    </aside>

    <section class="view-wrap">
      <div class="view-tools">
        <button id="btn-collapse-all" title="Thu gọn mọi khung Lặp / Rẽ nhánh">Thu gọn tất cả</button>
        <button id="btn-expand-all" title="Mở mọi khung Lặp / Rẽ nhánh">Mở tất cả</button>
      </div>
      <div id="process" class="process" role="tree" aria-label="Các bước của workflow"></div>
      <div id="issues" class="issues" hidden></div>
    </section>

    <aside id="inspector" class="inspector" aria-label="Cấu hình bước"></aside>
  </main>

  <section id="results" class="results collapsed">
    <div class="results-head">
      <button id="btn-results-toggle" class="link">Kết quả</button>
      <div id="results-summary" class="summary">Chưa chạy.</div>
      <div class="spacer"></div>
      <button id="btn-dl-json" disabled>Tải JSON</button>
      <button id="btn-dl-csv" disabled>Tải CSV (tab hiện tại)</button>
    </div>
    <div id="results-body" class="results-body"></div>
  </section>

  <dialog id="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
